<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الانتظار والاستراحات</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .section-title {
            color: #3b82f6;
            font-size: 1.2rem;
            margin-bottom: 15px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 8px;
        }
        /* التصميم الأصلي تماماً لعناصر القائمة */
        .card-item {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .name-text {
            font-size: 1.1rem;
            font-weight: bold;
        }
        /* الأرقام الدائرية بنفس تصميم صورتك الأولى */
        .badge {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: #000;
        }
        .badge-waiting {
            background-color: #f59e0b; /* البرتقالي الأصلي */
        }
        .badge-break {
            background-color: #10b981; /* الأخضر للبريك */
            color: #fff;
        }
        .badge-overtime {
            background-color: #ef4444; /* أحمر عند تجاوز البريك السريع */
            color: #fff;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0.4; }
        }
        
        /* لوحة التحكم والتقارير */
        .control-panel, .report-panel {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        button {
            padding: 10px 18px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-left: 8px;
            font-size: 0.95rem;
        }
        .btn-regular { background-color: #10b981; color: white; }
        .btn-quick { background-color: #f59e0b; color: #000; }
        .btn-end { background-color: #374151; color: white; }
        
        .alert-box {
            background-color: #ef4444;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            display: none;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #1f2937;
            padding: 10px;
            text-align: center;
            font-size: 0.9rem;
        }
        th {
            color: #3b82f6;
            background-color: #0b0f19;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- لوحة تحكم الموظف لاختيار البريك -->
    <div class="control-panel">
        <div class="section-title">لوحة تحكم الموظف</div>
        <div id="alertBox" class="alert-box">⚠️ تنبيه شخصي: لقد تجاوزت وقت البريك السريع المسموح به (5 دقائق)!</div>
        <p style="margin-top: 0;">اختر حالة الاستراحة الخاصة بك:</p>
        <button class="btn-regular" onclick="startBreak('regular')">بدء بريك عادي</button>
        <button class="btn-quick" onclick="startBreak('quick')">بدء بريك سريع (5 دقائق)</button>
        <button class="btn-end" onclick="endBreak()">إنهاء البريك والعودة</button>
        <div id="timerStatus" style="margin-top: 10px; font-weight: bold; color: #3b82f6;"></div>
    </div>

    <!-- قائمة الانتظار -->
    <div class="section-title">قائمة الانتظار</div>
    <div id="waitingListContainer">
        <!-- يتم تعبئتها ديناميكياً بنفس التصميم الدائري البرتقالي -->
    </div>

    <!-- الموظفون في البريك (باللون الأخضر) -->
    <div class="section-title" style="margin-top: 30px;">الموظفون في البريك (باللون الأخضر)</div>
    <div id="breakListContainer">
        <!-- يتم تعبئتها ديناميكياً باللون الأخضر -->
    </div>

    <!-- تقارير الإدارة -->
    <div class="report-panel" style="margin-top: 30px;">
        <div class="section-title">تقارير الإدارة (سجل البريكات)</div>
        <table>
            <thead>
                <tr>
                    <th>اسم الموظف</th>
                    <th>نوع البريك</th>
                    <th>الوقت المستغرق</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="adminReportTable">
                <tr><td colspan="4" style="color: #6b7280;">لا توجد سجلات حالية</td></tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    // البيانات التجريبية لأرقام الانتظار بنفس التصميم الأصلي
    let waitingQueue = [
        { id: 1, name: "ضاري" },
        { id: 2, name: "جنى" },
        { id: 3, name: "زاهية" }
    ];

    let activeBreaks = []; // موظفون آخرون في البريك
    let reportLogs = [];   // سجلات تقارير الإدارة
    
    let currentEmployee = {
        name: "محمد (أنت)",
        active: false,
        type: null,
        startTime: null,
        timerInterval: null
    };

    function render() {
        // 1. رسم قائمة الانتظار (دائرة برتقالية + الاسم)
        let waitingHTML = "";
        waitingQueue.forEach(item => {
            waitingHTML += `
                <div class="card-item">
                    <span class="name-text">${item.name}</span>
                    <span class="badge badge-waiting">#${item.id}</span>
                </div>
            `;
        });
        document.getElementById('waitingListContainer').innerHTML = waitingHTML;

        // 2. رسم قائمة البريك (دائرة خضراء، وتتحول لأحمر إذا تخطى 5 دقائق للبريك السريع)
        let breakHTML = "";
        
        if (currentEmployee.active) {
            let isOver = currentEmployee.type === 'quick' && ((new Date() - currentEmployee.startTime) / 1000 > 300);
            let badgeClass = isOver ? "badge-overtime" : "badge-break";
            let typeLabel = currentEmployee.type === 'quick' ? 'بريك سريع (5د)' : 'بريك عادي';
            
            breakHTML += `
                <div class="card-item">
                    <span class="name-text">${currentEmployee.name} (${typeLabel})</span>
                    <span class="badge ${badgeClass}">#1</span>
                </div>
            `;
        }

        activeBreaks.forEach((b, index) => {
            breakHTML += `
                <div class="card-item">
                    <span class="name-text">${b.name} (${b.type === 'quick' ? 'بريك سريع' : 'بريك عادي'})</span>
                    <span class="badge badge-break">#${index + 2}</span>
                </div>
            `;
        });

        document.getElementById('breakListContainer').innerHTML = breakHTML || '<div style="color: #6b7280; padding: 10px;">لا يوجد موظفون في البريك حالياً</div>';

        // 3. تحديث جدول تقارير الإدارة
        let reportHTML = "";
        reportLogs.forEach(log => {
            reportHTML += `
                <tr>
                    <td>${log.name}</td>
                    <td>${log.type === 'quick' ? 'بريك سريع (5 دقائق)' : 'بريك عادي'}</td>
                    <td>${log.duration} ثانية</td>
                    <td>${log.exceeded ? '<span style="color: #ef4444; font-weight: bold;">متجاوز للوقت ⚠️</span>' : '<span style="color: #10b981;">منتظم</span>'}</td>
                </tr>
            `;
        });
        if(reportLogs.length > 0) {
            document.getElementById('adminReportTable').innerHTML = reportHTML;
        }
    }

    function startBreak(type) {
        if (currentEmployee.active) return;
        currentEmployee.active = true;
        currentEmployee.type = type;
        currentEmployee.startTime = new Date();
        document.getElementById('alertBox').style.display = 'none';

        // تفعيل العداد المؤقت والتنبيهات
        if (type === 'quick') {
            currentEmployee.timerInterval = setInterval(() => {
                let elapsedSec = Math.floor((new Date() - currentEmployee.startTime) / 1000);
                let remaining = 300 - elapsedSec; // 300 ثانية = 5 دقائق

                if (remaining > 0) {
                    let m = Math.floor(remaining / 60);
                    let s = remaining % 60;
                    document.getElementById('timerStatus').innerText = `المتبقي للبريك السريع: ${m}:${s < 10 ? '0' : ''}${s}`;
                } else {
                    document.getElementById('timerStatus').innerText = "⚠️ لقد تجاوزت وقت البريك السريع المسموح!";
                    document.getElementById('alertBox').style.display = 'block';
                }
                render();
            }, 1000);
        } else {
            document.getElementById('timerStatus').innerText = "أنت في بريك عادي مفتوح.";
        }
        render();
    }

    function endBreak() {
        if (!currentEmployee.active) return;
        clearInterval(currentEmployee.timerInterval);

        let endTime = new Date();
        let totalSeconds = Math.floor((endTime - currentEmployee.startTime) / 1000);
        let exceeded = currentEmployee.type === 'quick' && totalSeconds > 300;

        // تسجيل البيانات للإدارة
        reportLogs.push({
            name: currentEmployee.name,
            type: currentEmployee.type,
            duration: totalSeconds,
            exceeded: exceeded
        });

        // إعادة ضبط الحالة
        currentEmployee.active = false;
        currentEmployee.type = null;
        currentEmployee.startTime = null;
        document.getElementById('timerStatus').innerText = "";
        document.getElementById('alertBox').style.display = 'none';

        render();
    }

    // التشغيل الأول
    render();
</script>

</body>
</html>
