<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سستم استراحة الموظفين المشترك</title>
    <!-- استدعاء قواعد بيانات Firebase السحابية الحية -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #151d2a;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #232d3f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 650px; }

        header {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        h2 { font-size: 1.5rem; margin-bottom: 8px; }

        .status-tag {
            font-size: 0.85rem;
            color: var(--accent-green);
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px; height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .admin-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: bold;
        }

        .notif-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: bold;
        }

        .action-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-buttons button {
            flex: 1;
        }

        input[type="text"] {
            flex: 1;
            background: #0b0f19;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus { border-color: var(--accent-blue); }

        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        .btn-green { background: var(--accent-green); }
        .btn-amber { background: var(--accent-amber); color: #0b0f19; }
        .btn-red { background: var(--accent-red); padding: 6px 12px; font-size: 0.85rem; }
        .btn-gray { background: #334155; font-size: 0.8rem; padding: 6px 12px; }
        .btn-excel { background: #059669; font-size: 0.8rem; padding: 6px 12px; color: white; display: none; }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 15px 0 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-active {
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid var(--accent-green);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-active.overtime {
            background: rgba(239, 68, 68, 0.15);
            border: 2px solid var(--accent-red);
        }

        .card-waiting {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .my-turn-prompt {
            background: linear-gradient(135deg, #065f46, #047857);
            border: 2px solid var(--accent-green);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
            display: none;
            animation: pulseGlow 1.5s infinite alternate;
        }

        @keyframes pulseGlow {
            from { box-shadow: 0 0 10px rgba(16,185,129,0.2); }
            to { box-shadow: 0 0 25px rgba(16,185,129,0.6); }
        }

        .my-turn-prompt h3 { color: #fff; margin-bottom: 8px; font-size: 1.2rem; }
        .my-turn-prompt p { color: #d1fae5; margin-bottom: 12px; font-size: 0.95rem; }

        .swap-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 15px;
            margin-top: 20px;
        }

        .swap-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        select {
            flex: 1;
            background: #0b0f19;
            border: 1px solid var(--border);
            color: white;
            padding: 10px;
            border-radius: 8px;
            min-width: 120px;
        }

        .report-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 15px;
            margin-top: 25px;
        }

        .report-item {
            font-size: 0.85rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            padding: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .empty-msg { color: var(--text-muted); font-size: 0.9rem; padding: 10px 0; }
        
        .toggle-arrow-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: background 0.2s, transform 0.2s;
        }
        .toggle-arrow-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <button class="admin-badge" id="adminBtn" onclick="toggleAdmin()">🔒 وضع الأدمن</button>
        <button class="notif-badge" id="notifBtn" onclick="requestNotificationPermission()">🔔 تفعيل الإشعارات</button>
        <h2>☕ سستم استراحة الموظفين المشترك</h2>
        <span class="status-tag"><span class="dot"></span> متصل لايف ومزامن للجميع</span>
    </header>

    <!-- صندوق تنبيه وتأكيد الدور الخاص بك -->
    <div id="myTurnPromptBox" class="my-turn-prompt">
        <h3 id="promptTitle">🎉 حان دورك بالبريك!</h3>
        <p id="promptDesc">الرجاء التأكيد والدخول الآن.</p>
        <button type="button" class="btn btn-amber" style="background: #ffffff; color: #065f46; font-size: 1.05rem;" onclick="confirmMyTurn()">✅ تأكيد ودخول البريك الآن</button>
    </div>

    <div class="action-box">
        <input type="text" id="empName" placeholder="أدخل اسمك أولاً..." autocomplete="off" />
        <div class="action-buttons">
            <button type="button" class="btn btn-green" onclick="submitBreak('normal')">بريك عادي 🏃</button>
            <button type="button" class="btn btn-amber" onclick="submitBreak('quick')">⚡ بريك سريع (5 دقائق)</button>
        </div>
    </div>

    <div class="section-title" style="color: var(--accent-green);">
        <span>🏃 في البريك الآن (عادي + سريع)</span>
    </div>
    <div id="activeBox"></div>

    <div class="section-title" style="color: var(--accent-amber);">
        <span>📋 قائمة الانتظار</span>
    </div>
    <div id="waitingBox"></div>

    <!-- صندوق تبديل الأدوار -->
    <div class="swap-box" id="swapSection" style="display: none;">
        <div style="font-weight: bold; color: var(--accent-amber);">🔄 تبديل الأدوار في قائمة الانتظار:</div>
        <div class="swap-controls">
            <select id="swap1"></select>
            <span>مع</span>
            <select id="swap2"></select>
            <button type="button" class="btn btn-amber" onclick="executeSwap()">تبديل</button>
        </div>
    </div>

    <!-- قسم تقارير وسجل البريكات لآخر 24 ساعة -->
    <div class="report-box">
        <div class="section-title" style="margin: 0 0 10px 0; color: var(--text-main);">
            <span>📊 سجل آخر 24 ساعة</span>
            <div style="display: flex; gap: 6px; align-items: center;">
                <button type="button" class="btn btn-excel" id="excelBtn" onclick="exportToExcel()">📥 تحميل Excel</button>
                <button type="button" class="btn btn-gray" id="clearBtn" style="display: none;" onclick="clearReports()">مسح السجل</button>
                <button type="button" class="toggle-arrow-btn" id="toggleReportsBtn" onclick="toggleReportsExpand()" title="توسعة السجل">▼</button>
            </div>
        </div>
        <div id="reportsBox"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://break-system-4a453-default-rtdb.firebaseio.com/"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database().ref('shared_company_breaks_v15');

    let state = { active: [], waiting: [], reports: [] };
    let isAdmin = localStorage.getItem('is_admin_mode') === 'true';
    let myName = localStorage.getItem('my_employee_name') || '';
    let isReportsExpanded = false; // متغير لحفظ حالة التوسعة للسجل

    document.addEventListener('DOMContentLoaded', () => {
        updateNotificationButtonUI();
    });

    function toggleReportsExpand() {
        isReportsExpanded = !isReportsExpanded;
        const btn = document.getElementById('toggleReportsBtn');
        btn.innerText = isReportsExpanded ? '▲' : '▼';
        btn.title = isReportsExpanded ? 'إخفاء وتصغير السجل' : 'توسعة السجل';
        renderUI();
    }

    function updateNotificationButtonUI() {
        const btn = document.getElementById('notifBtn');
        if (!("Notification" in window)) {
            btn.style.display = 'none';
            return;
        }
        if (Notification.permission === "granted") {
            btn.innerText = '🔔 الإشعارات مفعلة';
            btn.style.background = 'rgba(16, 185, 129, 0.2)';
            btn.style.color = 'var(--accent-green)';
        } else if (Notification.permission === "denied") {
            btn.innerText = '🔕 الإشعارات محظورة';
            btn.style.background = 'rgba(239, 68, 68, 0.2)';
            btn.style.color = 'var(--accent-red)';
        } else {
            btn.innerText = '🔔 تفعيل الإشعارات';
        }
    }

    function requestNotificationPermission() {
        if (!("Notification" in window)) {
            alert('متصفحك لا يدعم الإشعارات المنبثقة.');
            return;
        }
        Notification.requestPermission().then(permission => {
            updateNotificationButtonUI();
            if (permission === "granted") {
                new Notification("☕ تم تفعيل الإشعارات بنجاح!", {
                    body: "ستتلقى تنبيهات دورك هنا بشكل فوري.",
                    icon: "https://cdn-icons-png.flaticon.com/512/3176/3176366.png"
                });
            } else {
                alert('تم رفض إذن الإشعارات. يرجى تفعيلها من شريط العنوان في المتصفح.');
            }
        });
    }

    function playBeep() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        } catch(e) {}
    }

    function sendDesktopNotification(title, bodyText) {
        playBeep();
        if ("Notification" in window && Notification.permission === "granted") {
            try {
                const notif = new Notification(title, {
                    body: bodyText,
                    icon: "https://cdn-icons-png.flaticon.com/512/3176/3176366.png",
                    requireInteraction: true
                });
                notif.onclick = function() {
                    window.focus();
                    notif.close();
                };
            } catch(e) {}
        }
    }

    let lastNotifiedTurnState = "";

    db.on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
            const twentyFourHoursAgo = Date.now() - (24 * 60 * 60 * 1000);
            let filteredReports = (val.reports || []).filter(rep => rep.endTimestamp > twentyFourHoursAgo);

            state = {
                active: val.active || [],
                waiting: val.waiting || [],
                reports: filteredReports
            };
        } else {
            state = { active: [], waiting: [], reports: [] };
        }

        checkMyTurnAndNotify();
        renderUI();
    });

    function checkMyTurnAndNotify() {
        if (!myName) return;
        const myUserLower = myName.trim().toLowerCase();
        const newActive = state.active || [];
        const newWaiting = state.waiting || [];

        const firstNormal = newWaiting.find(w => w.type === 'normal');
        const firstQuick = newWaiting.find(w => w.type === 'quick');
        const hasNormalSlot = !newActive.some(a => a.type === 'normal');
        const hasQuickSlot = !newActive.some(a => a.type === 'quick');

        const isMyTurn = (firstNormal && firstNormal.name.trim().toLowerCase() === myUserLower && hasNormalSlot) ||
                         (firstQuick && firstQuick.name.trim().toLowerCase() === myUserLower && hasQuickSlot);

        const myIndex = newWaiting.findIndex(w => w.name.trim().toLowerCase() === myUserLower);
        const isAlmostMyTurn = (myIndex === 0 && !isMyTurn);

        if (isMyTurn) {
            if (lastNotifiedTurnState !== "my_turn") {
                lastNotifiedTurnState = "my_turn";
                sendDesktopNotification("🚨 حان دورك بالبريك", "حان دورك بالبريك الرجاء التأكيد والدخول الآن");
            }
        } else if (isAlmostMyTurn) {
            if (lastNotifiedTurnState !== "almost_turn") {
                lastNotifiedTurnState = "almost_turn";
                sendDesktopNotification("⏳ تنبيه قرب الدور", "هناك شخص واحد قبلك استعد");
            }
        } else {
            if (myIndex > 0 || myIndex === -1) {
                lastNotifiedTurnState = "";
            }
        }

        if (newWaiting.length > 0) {
            let targetToShift = null;
            if (firstNormal && hasNormalSlot) targetToShift = firstNormal;
            else if (firstQuick && hasQuickSlot) targetToShift = firstQuick;

            if (targetToShift) {
                const now = Date.now();
                if (!targetToShift.turnStartTime) {
                    targetToShift.turnStartTime = now;
                    db.set(state);
                } else {
                    if (now - targetToShift.turnStartTime > 300000) {
                        const idx = newWaiting.findIndex(w => w.id === targetToShift.id);
                        if (idx > -1) {
                            const shiftedItem = newWaiting.splice(idx, 1)[0];
                            delete shiftedItem.turnStartTime;
                            newWaiting.push(shiftedItem);
                            db.set(state);
                        }
                    }
                }
            }
        }
    }

    function toggleAdmin() {
        if (!isAdmin) {
            const pass = prompt('الرجاء إدخال كلمة مرور الأدمن:');
            if (pass === '1234') { 
                isAdmin = true;
                localStorage.setItem('is_admin_mode', 'true');
                alert('تم تفعيل وضع الأدمن بنجاح!');
                renderUI();
            } else if (pass !== null) {
                alert('كلمة المرور غير صحيحة!');
            }
        } else {
            isAdmin = false;
            localStorage.setItem('is_admin_mode', 'false');
            alert('تم الخروج من وضع الأدمن.');
            renderUI();
        }
    }

    function submitBreak(type) {
        const input = document.getElementById('empName');
        const name = input.value.trim();
        if (!name) {
            alert('يرجى إدخال اسمك أولاً!');
            return;
        }

        const nameLower = name.toLowerCase();
        const isInActive = state.active.some(item => item.name.trim().toLowerCase() === nameLower);
        const isInWaiting = state.waiting.some(item => item.name.trim().toLowerCase() === nameLower);

        if (isInActive || isInWaiting) {
            alert('عذراً، هذا الاسم موجود بالفعل (إما في البريك أو في الانتظار)!');
            return;
        }

        myName = name;
        localStorage.setItem('my_employee_name', myName);
        lastNotifiedTurnState = "";

        const now = Date.now();
        const newItem = {
            id: String(now),
            name: name,
            type: type,
            timestamp: now,
            timeStr: new Date().toLocaleTimeString('ar-KW', { hour: '2-digit', minute: '2-digit' })
        };

        if (state.waiting.length > 0) {
            state.waiting.push(newItem);
        } else {
            const hasNormal = state.active.some(item => item.type === 'normal');
            const hasQuick = state.active.some(item => item.type === 'quick');

            let canEnter = false;
            if (type === 'normal' && !hasNormal) canEnter = true;
            else if (type === 'quick' && !hasQuick) canEnter = true;

            if (canEnter) state.active.push(newItem);
            else state.waiting.push(newItem);
        }

        input.value = '';
        db.set(state);
    }

    function confirmMyTurn() {
        if (!myName) return;
        const myUserLower = myName.trim().toLowerCase();
        
        const index = state.waiting.findIndex(item => item.name.trim().toLowerCase() === myUserLower);
        if (index === -1) {
            alert('أنت لست في قائمة الانتظار حالياً!');
            return;
        }

        const userItem = state.waiting[index];
        const firstOfThisType = state.waiting.find(w => w.type === userItem.type);
        if (!firstOfThisType || firstOfThisType.id !== userItem.id) {
            alert('عذراً، يوجد شخص قبلك في طابور الانتظار يجب أن يأخذ دوره أولاً!');
            return;
        }

        const hasSameTypeActive = state.active.some(item => item.type === userItem.type);
        if (hasSameTypeActive) {
            alert(`مكان بريك (${userItem.type === 'normal' ? 'العادي' : 'السريع'}) ما زال ممتلئاً.`);
            return;
        }

        state.waiting.splice(index, 1);
        userItem.timestamp = Date.now();
        userItem.timeStr = new Date().toLocaleTimeString('ar-KW', { hour: '2-digit', minute: '2-digit' });
        delete userItem.turnStartTime;
        state.active.push(userItem);

        db.set(state);
    }

    function endBreak(index) {
        const finishedItem = state.active.splice(index, 1)[0];
        
        if (finishedItem) {
            const endTime = Date.now();
            const durationMs = endTime - finishedItem.timestamp;
            const durationMins = Math.floor(durationMs / 60000);
            const durationText = durationMins === 0 ? 'أقل من دقيقة' : `${durationMins} دقيقة`;
            const endTimeStr = new Date().toLocaleTimeString('ar-KW', { hour: '2-digit', minute: '2-digit' });
            const typeText = finishedItem.type === 'quick' ? 'بريك سريع (5 دقائق)' : 'بريك عادي';

            state.reports.unshift({
                name: finishedItem.name,
                type: typeText,
                startTime: finishedItem.timeStr,
                endTime: endTimeStr,
                duration: durationText,
                endTimestamp: endTime
            });
        }

        db.set(state);
    }

    function cancelWaiting(index) {
        const item = state.waiting[index];
        const isOwner = myName && item.name.trim().toLowerCase() === myName.trim().toLowerCase();

        if (!isOwner && !isAdmin) {
            alert('يمكنك إلغاء دورك الخاص فقط!');
            return;
        }

        if (confirm(`هل أنت متأكد من إلغاء دور (${item.name})؟`)) {
            state.waiting.splice(index, 1);
            db.set(state);
        }
    }

    function executeSwap() {
        const id1 = document.getElementById('swap1').value;
        const id2 = document.getElementById('swap2').value;

        if (!id1 || !id2 || id1 === id2) {
            alert('يرجى اختيار اسمين مختلفين للتبديل!');
            return;
        }

        const idx1 = state.waiting.findIndex(x => x.id === id1);
        const idx2 = state.waiting.findIndex(x => x.id === id2);

        if (idx1 > -1 && idx2 > -1) {
            const temp = state.waiting[idx1];
            state.waiting[idx1] = state.waiting[idx2];
            state.waiting[idx2] = temp;
            db.set(state);
        }
    }

    function clearReports() {
        if (!isAdmin) {
            alert('هذا الإجراء مخصص للأدمن فقط!');
            return;
        }
        if (confirm('هل أنت متأكد من مسح السجل؟')) {
            state.reports = [];
            db.set(state);
        }
    }

    function exportToExcel() {
        if (!isAdmin) {
            alert('هذا الخيار مخصص للأدمن فقط!');
            return;
        }
        if (!state.reports || state.reports.length === 0) {
            alert('لا توجد تقارير لتصديرها حالياً!');
            return;
        }

        let csvContent = "\uFEFFاسم الموظف,نوع البريك,وقت الخروج,وقت العودة,مدة البريك\n";
        state.reports.forEach(rep => {
            csvContent += `"${rep.name}","${rep.type}","${rep.startTime}","${rep.endTime}","${rep.duration}"\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `break_reports_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function renderUI() {
        const currentTime = Date.now();
        const adminBtn = document.getElementById('adminBtn');
        const clearBtn = document.getElementById('clearBtn');
        const excelBtn = document.getElementById('excelBtn');
        
        if (isAdmin) {
            adminBtn.style.background = 'rgba(16, 185, 129, 0.2)';
            adminBtn.style.color = 'var(--accent-green)';
            adminBtn.style.borderColor = 'var(--accent-green)';
            adminBtn.innerText = '🔓 أدمن (مفعل)';
            clearBtn.style.display = 'inline-block';
            excelBtn.style.display = 'inline-block';
        } else {
            adminBtn.style.background = 'rgba(59, 130, 246, 0.15)';
            adminBtn.style.color = 'var(--accent-blue)';
            adminBtn.style.borderColor = 'var(--accent-blue)';
            adminBtn.innerText = '🔒 وضع الأدمن';
            clearBtn.style.display = 'none';
            excelBtn.style.display = 'none';
        }

        const promptBox = document.getElementById('myTurnPromptBox');
        let showMyPrompt = false;

        if (myName && state.waiting.length > 0) {
            const myUserLower = myName.trim().toLowerCase();
            const firstNormal = state.waiting.find(w => w.type === 'normal');
            const firstQuick = state.waiting.find(w => w.type === 'quick');
            const hasNormalSlot = !state.active.some(a => a.type === 'normal');
            const hasQuickSlot = !state.active.some(a => a.type === 'quick');

            if (firstNormal && firstNormal.name.trim().toLowerCase() === myUserLower && hasNormalSlot) {
                showMyPrompt = true;
            } else if (firstQuick && firstQuick.name.trim().toLowerCase() === myUserLower && hasQuickSlot) {
                showMyPrompt = true;
            }
        }

        promptBox.style.display = showMyPrompt ? 'block' : 'none';

        const aBox = document.getElementById('activeBox');
        if (!state.active || state.active.length === 0) {
            aBox.innerHTML = '<div class="empty-msg">لا يوجد أحد بالبريك حالياً</div>';
        } else {
            aBox.innerHTML = state.active.map((item, i) => {
                const minsInBreak = Math.floor((currentTime - item.timestamp) / 60000);
                const activeDurationStr = minsInBreak === 0 ? 'منذ أقل من دقيقة' : `منذ ${minsInBreak} دقيقة`;
                const isOwner = myName && item.name.trim().toLowerCase() === myName.trim().toLowerCase();
                const showEndBtn = (isOwner || isAdmin);
                const isQuick = item.type === 'quick';
                const isOvertime = isQuick && minsInBreak > 5;

                let warningHtml = '';
                if (isQuick) {
                    if (isOvertime) {
                        warningHtml = `<br><span style="color: var(--accent-red); font-weight: bold; font-size: 0.85rem;">⚠️ تجاوزت الوقت (5 دقائق)!</span>`;
                    } else {
                        warningHtml = `<br><span style="color: var(--accent-blue); font-size: 0.8rem;">⚡ بريك سريع (متبقي ${Math.max(0, 5 - minsInBreak)} دقائق)</span>`;
                    }
                }

                return `
                    <div class="card-active ${isOvertime ? 'overtime' : ''}">
                        <div>
                            <strong>${item.name}</strong> 
                            <span style="margin-right: 8px;">⏱️ ${activeDurationStr}</span>
                            ${isQuick ? '<span style="color:var(--accent-blue);">[سريع]</span>' : '<span style="color:var(--accent-amber);">[عادي]</span>'}
                            <br><small style="color:var(--text-muted)">وقت الخروج: ${item.timeStr}</small>
                            ${warningHtml}
                        </div>
                        ${showEndBtn ? `<button type="button" class="btn btn-red" onclick="endBreak(${i})">إنهاء البريك</button>` : `<span style="font-size:0.8rem; color:var(--text-muted);">بريك زميلك</span>`}
                    </div>
                `;
            }).join('');
        }

        const wBox = document.getElementById('waitingBox');
        if (!state.waiting || state.waiting.length === 0) {
            wBox.innerHTML = '<div class="empty-msg">قائمة الانتظار فارغة</div>';
        } else {
            wBox.innerHTML = state.waiting.map((item, i) => {
                const minsWaiting = Math.floor((currentTime - item.timestamp) / 60000);
                const waitingDurationStr = minsWaiting === 0 ? 'منذ أقل من دقيقة' : `انتظار: ${minsWaiting} دقيقة`;
                const isOwner = myName && item.name.trim().toLowerCase() === myName.trim().toLowerCase();
                const showCancelBtn = (isOwner || isAdmin);
                const isQuick = item.type === 'quick';

                let isReadyToConfirm = false;
                if (isQuick) {
                    const firstQ = state.waiting.find(w => w.type === 'quick');
                    const hasQSlot = !state.active.some(a => a.type === 'quick');
                    if (firstQ && firstQ.id === item.id && hasQSlot) isReadyToConfirm = true;
                } else {
                    const firstN = state.waiting.find(w => w.type === 'normal');
                    const hasNSlot = !state.active.some(a => a.type === 'normal');
                    if (firstN && firstN.id === item.id && hasNSlot) isReadyToConfirm = true;
                }

                return `
                    <div class="card-waiting" style="${isReadyToConfirm ? 'border-color: var(--accent-green); background: rgba(16,185,129,0.05);' : ''}">
                        <div>
                            <span>#${i + 1} - <strong>${item.name}</strong></span>
                            <span style="margin-right: 8px; color:var(--text-muted);">${waitingDurationStr}</span>
                            ${isQuick ? '<span style="color:var(--accent-blue);">[سريع]</span>' : '<span style="color:var(--accent-amber);">[عادي]</span>'}
                            ${isReadyToConfirm ? '<br><small style="color: var(--accent-green); font-weight: bold;">⚡ حان دورك بانتظار التأكيد!</small>' : (i === 0 ? '<br><small style="color: var(--accent-amber);">⏳ أنت التالي (هناك شخص واحد قبلك)</small>' : '')}
                        </div>
                        ${showCancelBtn ? `<button type="button" class="btn btn-red" style="padding: 4px 10px; font-size: 0.75rem;" onclick="cancelWaiting(${i})">إلغاء الدور</button>` : ``}
                    </div>
                `;
            }).join('');
        }

        const s1 = document.getElementById('swap1');
        const s2 = document.getElementById('swap2');
        s1.innerHTML = s2.innerHTML = '';

        if (state.waiting && state.waiting.length >= 2) {
            document.getElementById('swapSection').style.display = 'block';
            state.waiting.forEach((item, i) => {
                s1.add(new Option(`#${i + 1} - ${item.name} (${item.type === 'quick' ? 'سريع' : 'عادي'})`, item.id));
                s2.add(new Option(`#${i + 1} - ${item.name} (${item.type === 'quick' ? 'سريع' : 'عادي'})`, item.id));
            });
            if (s2.options.length > 1) s2.selectedIndex = 1;
        } else {
            document.getElementById('swapSection').style.display = 'none';
        }

        // عرض السجل بحيث يظهر آخر 4 أسماء افتراضياً، وتوسعتها بالكامل عند الضغط على زر السهم
        const rBox = document.getElementById('reportsBox');
        if (!state.reports || state.reports.length === 0) {
            rBox.innerHTML = '<div class="empty-msg">لا توجد تقارير مسجلة في آخر 24 ساعة</div>';
        } else {
            const reportsToDisplay = isReportsExpanded ? state.reports : state.reports.slice(0, 4);
            
            let htmlContent = reportsToDisplay.map(rep => `
                <div class="report-item">
                    <div>
                        <strong>${rep.name}</strong> 
                        <span style="color:var(--text-muted); margin-right:6px;">(${rep.type})</span>
                        <span style="color:var(--text-muted); margin-right:6px;">(من ${rep.startTime} إلى ${rep.endTime})</span>
                    </div>
                    <span style="color: var(--accent-green); font-weight: bold;">المدة: ${rep.duration}</span>
                </div>
            `).join('');

            if (!isReportsExpanded && state.reports.length > 4) {
                htmlContent += `<div style="text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 8px;">يتم عرض آخر 4 أسماء فقط (اضغط على السهم للأعلى لتوسعة ورؤية باقي السجل)</div>`;
            }

            rBox.innerHTML = htmlContent;
        }
    }
</script>
</body>
</html>
