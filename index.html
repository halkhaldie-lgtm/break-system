<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سستم استراحة الموظفين اللحظي السحابي</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #151d2a;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #232d3f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 600px; }

        header {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        h2 { font-size: 1.5rem; margin-bottom: 8px; }

        .status-tag {
            font-size: 0.85rem;
            color: var(--accent-green);
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px; height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .action-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: #0b0f19;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus { border-color: var(--accent-blue); }

        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        .btn-green { background: var(--accent-green); }
        .btn-amber { background: var(--accent-amber); color: #0b0f19; }
        .btn-red { background: var(--accent-red); padding: 6px 12px; font-size: 0.85rem; }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 15px 0 10px 0;
            display: flex;
            justify-content: space-between;
        }

        .card-active {
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid var(--accent-green);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-waiting {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .swap-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 15px;
            margin-top: 20px;
        }

        .swap-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        select {
            flex: 1;
            background: #0b0f19;
            border: 1px solid var(--border);
            color: white;
            padding: 10px;
            border-radius: 8px;
            min-width: 120px;
        }

        .empty-msg { color: var(--text-muted); font-size: 0.9rem; padding: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>☕ سستم استراحة الموظفين اللحظي السحابي</h2>
        <span class="status-tag"><span class="dot"></span> متصل مباشرة أونلاين</span>
    </header>

    <div class="action-box">
        <input type="text" id="empName" placeholder="أدخل اسمك واضغط Enter أو الزر..." autocomplete="off" onkeydown="if(event.key === 'Enter') submitBreak();" />
        <button type="button" class="btn btn-green" id="submitBtn" onclick="submitBreak()">طلب بريك 🏃</button>
    </div>

    <div class="section-title" style="color: var(--accent-green);">
        <span>🏃 في البريك الآن (أقصى حد 2)</span>
    </div>
    <div id="activeBox"></div>

    <div class="section-title" style="color: var(--accent-amber);">
        <span>📋 قائمة الانتظار</span>
    </div>
    <div id="waitingBox"></div>

    <div class="swap-box" id="swapSection" style="display: none;">
        <div style="font-weight: bold; color: var(--accent-amber);">🔄 تبديل الأدوار في قائمة الانتظار:</div>
        <div class="swap-controls">
            <select id="swap1"></select>
            <span>مع</span>
            <select id="swap2"></select>
            <button type="button" class="btn btn-amber" onclick="executeSwap()">تبديل</button>
        </div>
    </div>
</div>

<script>
    // رابط خادم البيانات المفتوح للتحديث السحابي المباشر
    const API_URL = "https://api.jsonbin.io/v3/b/66f000001122334455667788"; // سيرفر مزامنة عام
    
    // ذاكرة سحابية مرنة سريعة مع استجابة فورية للواجهة
    let state = { active: [], waiting: [] };

    async function fetchCloudData() {
        try {
            const res = await fetch("https://api.myjson.online/v1/records/487bd132-e070-498f-8d9e-10fb8d4e410b");
            if(res.ok) {
                const json = await res.json();
                if(json && json.data) {
                    state = json.data;
                    renderUI();
                }
            }
        } catch(e) {
            // استمرارية التشغيل المحلي عند حدوث انقطاع شبكي
            renderUI();
        }
    }

    async function updateCloudData() {
        renderUI();
        try {
            await fetch("https://api.myjson.online/v1/records/487bd132-e070-498f-8d9e-10fb8d4e410b", {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: state })
            });
        } catch(e) {
            console.log(e);
        }
    }

    function submitBreak() {
        const input = document.getElementById('empName');
        const name = input.value.trim();
        if (!name) return;

        const newItem = {
            id: String(Date.now()),
            name: name,
            time: new Date().toLocaleTimeString('ar-KW', { hour: '2-digit', minute: '2-digit' })
        };

        if (state.active.length < 2) {
            state.active.push(newItem);
        } else {
            state.waiting.push(newItem);
        }

        input.value = '';
        updateCloudData();
    }

    function endBreak(index) {
        state.active.splice(index, 1);
        if (state.waiting.length > 0) {
            const next = state.waiting.shift();
            next.time = new Date().toLocaleTimeString('ar-KW', { hour: '2-digit', minute: '2-digit' });
            state.active.push(next);
        }
        updateCloudData();
    }

    function executeSwap() {
        const id1 = document.getElementById('swap1').value;
        const id2 = document.getElementById('swap2').value;

        if (!id1 || !id2 || id1 === id2) {
            alert('يرجى اختيار اسمين مختلفين للتبديل!');
            return;
        }

        const idx1 = state.waiting.findIndex(x => x.id === id1);
        const idx2 = state.waiting.findIndex(x => x.id === id2);

        if (idx1 > -1 && idx2 > -1) {
            const temp = state.waiting[idx1];
            state.waiting[idx1] = state.waiting[idx2];
            state.waiting[idx2] = temp;
            updateCloudData();
        }
    }

    function renderUI() {
        const aBox = document.getElementById('activeBox');
        if (!state.active || state.active.length === 0) {
            aBox.innerHTML = '<div class="empty-msg">لا يوجد أحد بالبريك حالياً</div>';
        } else {
            aBox.innerHTML = state.active.map((item, i) => `
                <div class="card-active">
                    <div><strong>${item.name}</strong> <small style="color:var(--text-muted)">(${item.time})</small></div>
                    <button type="button" class="btn btn-red" onclick="endBreak(${i})">إنهاء البريك</button>
                </div>
            `).join('');
        }

        const wBox = document.getElementById('waitingBox');
        if (!state.waiting || state.waiting.length === 0) {
            wBox.innerHTML = '<div class="empty-msg">قائمة الانتظار فارغة</div>';
        } else {
            wBox.innerHTML = state.waiting.map((item, i) => `
                <div class="card-waiting">
                    <span>#${i + 1} - ${item.name}</span>
                    <span style="color:var(--accent-amber); font-size:0.85rem">في الانتظار</span>
                </div>
            `).join('');
        }

        const s1 = document.getElementById('swap1');
        const s2 = document.getElementById('swap2');
        s1.innerHTML = s2.innerHTML = '';

        if (state.waiting && state.waiting.length >= 2) {
            document.getElementById('swapSection').style.display = 'block';
            state.waiting.forEach((item, i) => {
                s1.add(new Option(`#${i + 1} - ${item.name}`, item.id));
                s2.add(new Option(`#${i + 1} - ${item.name}`, item.id));
            });
            s2.selectedIndex = 1;
        } else {
            document.getElementById('swapSection').style.display = 'none';
        }
    }

    // تحديث الشاشة تلقائياً كل ثانيتين لمباشرة الأجهزة الأخرى
    setInterval(fetchCloudData, 2000);
    fetchCloudData();
</script>
</body>
</html>
