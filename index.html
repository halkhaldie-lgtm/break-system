<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة البريكات - مستشفيات السلام</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #0056b3;
            margin: 5px 0;
            font-size: 24px;
        }
        .trust-tag {
            color: #666;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background-color: #004085;
        }
        .section-title {
            margin-top: 30px;
            font-size: 18px;
            color: #0056b3;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #0056b3;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>مستشفيات السلام</h1>
        <div class="trust-tag">ثقتكم أمانة / T R U S T</div>
    </div>

    <div class="form-group">
        <label for="employeeName">اسم الموظف:</label>
        <input type="text" id="employeeName" placeholder="أدخل اسمك هنا">
    </div>

    <div class="form-group">
        <label for="breakType">نوع البريك:</label>
        <select id="breakType">
            <option value="Normal">بريك عادي (Normal Break)</option>
            <option value="Quick">بريك سريع (5 دقائق)</option>
            <option value="Request">بريك استثنائي (يحتاج موافقة مشرف)</option>
        </select>
    </div>

    <button onclick="requestBreak()">طلب بريك</button>

    <div class="section-title">قائمة الانتظار النشطة</div>
    <table id="queueTable">
        <thead>
            <tr>
                <th>التسلسل</th>
                <th>اسم الموظف</th>
                <th>نوع البريك</th>
                <th>الحالة</th>
            </tr>
        </thead>
        <tbody>
            <!-- يتم تعبئة البيانات برمجياً -->
        </tbody>
    </table>
</div>

<script>
// دالة التنبيه المخصص التي تعمل بنجاح تام
function showCustomAlert(message) {
    var existingAlert = document.getElementById('custom-alert-box');
    if (existingAlert) {
        existingAlert.remove();
    }
    var alertBox = document.createElement('div');
    alertBox.id = 'custom-alert-box';
    alertBox.style.position = 'fixed';
    alertBox.style.top = '20px';
    alertBox.style.left = '50%';
    alertBox.style.transform = 'translateX(-50%)';
    alertBox.style.backgroundColor = '#fff';
    alertBox.style.border = '2px solid #ff4d4d';
    alertBox.style.boxShadow = '0 4px 15px rgba(0, 0, 0, 0.2)';
    alertBox.style.padding = '20px 25px';
    alertBox.style.zIndex = '10000';
    alertBox.style.borderRadius = '8px';
    alertBox.style.textAlign = 'center';
    alertBox.style.maxWidth = '400px';
    alertBox.style.width = '90%';
    alertBox.style.fontFamily = 'Arial, sans-serif';

    var titleDiv = document.createElement('div');
    titleDiv.style.color = '#ff4d4d';
    titleDiv.style.fontSize = '20px';
    titleDiv.style.fontWeight = 'bold';
    titleDiv.style.marginBottom = '10px';
    titleDiv.innerHTML = '⚠️ تنبيه';

    var msgDiv = document.createElement('div');
    msgDiv.style.color = '#333';
    msgDiv.style.fontSize = '15px';
    msgDiv.style.lineHeight = '1.5';
    msgDiv.style.marginBottom = '15px';
    msgDiv.textContent = message;

    var btn = document.createElement('button');
    btn.id = 'custom-alert-btn';
    btn.style.backgroundColor = '#ff4d4d';
    btn.style.color = 'white';
    btn.style.border = 'none';
    btn.style.padding = '8px 20px';
    btn.style.fontSize = '14px';
    btn.style.fontWeight = 'bold';
    btn.style.borderRadius = '4px';
    btn.style.cursor = 'pointer';
    btn.textContent = 'حسناً';

    alertBox.appendChild(titleDiv);
    alertBox.appendChild(msgDiv);
    alertBox.appendChild(btn);

    document.body.appendChild(alertBox);

    btn.onclick = function() {
        alertBox.remove();
    };
}

// محاكاة مصفوفة حفظ حالة الموظفين والبريكات النشطة
let activeBreaks = [];

function requestBreak() {
    var nameInput = document.getElementById('employeeName').value.trim();
    var breakType = document.getElementById('breakType').value;

    if (!nameInput) {
        showCustomAlert("الرجاء إدخال اسم الموظف بشكل صحيح!");
        return;
    }

    // التحقق عما إذا كان الموظف في حالة بريك أو لديه طلب نشط مسبقاً
    var isAlreadyInBreak = activeBreaks.some(function(item) {
        return item.name === nameInput;
    });

    if (isAlreadyInBreak) {
        showCustomAlert("عذراً، أنت في فترة البريك حالياً أو لديك طلب مسجل بالفعل، لا يمكنك طلب بريك مرة أخرى حتى تنتهي!");
        return;
    }

    // إضافته لقائمة البريكات النشطة
    activeBreaks.push({ name: nameInput, type: breakType, status: 'نشط' });
    
    showCustomAlert("تم تسجيل طلب البريك بنجاح!");
    document.getElementById('employeeName').value = '';
    updateQueueUI();
}

function updateQueueUI() {
    var tbody = document.querySelector('#queueTable tbody');
    tbody.innerHTML = '';
    
    if (activeBreaks.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="color:#776;">لا توجد بريكات نشطة حالياً</td></tr>';
        return;
    }

    activeBreaks.forEach(function(item, index) {
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>' + (index + 1) + '</td><td>' + item.name + '</td><td>' + item.type + '</td><td>' + item.status + '</td>';
        tbody.appendChild(tr);
    });
}
</script>

</body>
</html>
