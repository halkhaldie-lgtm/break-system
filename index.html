<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سستم استراحة الموظفين المشترك</title>
    <!-- استدعاء قواعد بيانات Firebase السحابية الحية -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #070913 0%, #111827 50%, #1e1b4b 100%);
            --glass-bg: rgba(17, 24, 39, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-blue: #6366f1;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-attachment: fixed;
        }

        .container { width: 100%; max-width: 650px; }

        header {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h2 { 
            font-size: 1.5rem; 
            margin-bottom: 8px; 
            background: linear-gradient(to right, #818cf8, #c084fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-tag {
            font-size: 0.85rem;
            color: var(--accent-green);
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .dot {
            width: 8px; height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--accent-green);
        }

        .admin-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: bold;
        }

        .notif-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: bold;
        }

        .action-box {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .action-buttons { display: flex; gap: 10px; }
        .action-buttons button { flex: 1; }

        input[type="text"] {
            width: 100%;
            background: rgba(11, 15, 25, 0.7);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px 16px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: var(--accent-blue); }

        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }
        .btn-green { background: linear-gradient(135deg, #059669, #10b981); }
        .btn-amber { background: linear-gradient(135deg, #d97706, #f59e0b); color: #0b0f19; }
        .btn-red { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 12px; font-size: 0.85rem; border-radius: 8px; }
        .btn-gray { background: rgba(51, 65, 85, 0.6); border: 1px solid var(--glass-border); font-size: 0.8rem; padding: 6px 12px; border-radius: 8px; }
        .btn-excel { background: linear-gradient(135deg, #047857, #059669); font-size: 0.8rem; padding: 6px 12px; color: white; display: none; border-radius: 8px; }

        /* حاوية قسم البريك الحالي المميزة بمستطيل وتدرج فريد */
        .section-container-active {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, rgba(6, 78, 59, 0.15) 100%);
            border: 2px solid rgba(16, 185, 129, 0.35);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.1);
        }

        /* حاوية قائمة الانتظار المميزة بمستطيل وتدرج فريد */
        .section-container-waiting {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.08) 0%, rgba(120, 53, 15, 0.15) 100%);
            border: 2px solid rgba(245, 158, 11, 0.35);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.1);
        }

        .section-header-title {
            font-size: 1.05rem;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-active {
            background: rgba(6, 78, 59, 0.4);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-active.overtime {
            background: rgba(127, 29, 29, 0.4);
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        .card-waiting {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .my-turn-prompt {
            background: linear-gradient(135deg, #065f46, #047857);
            border: 1px solid #34d399;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
            display: none;
            animation: pulseGlow 1.5s infinite alternate;
        }
        @keyframes pulseGlow {
            from { box-shadow: 0 0 10px rgba(16,185,129,0.2); }
            to { box-shadow: 0 0 25px rgba(16,185,129,0.5); }
        }
        .my-turn-prompt h3 { color: #fff; margin-bottom: 6px; font-size: 1.2rem; }
        .my-turn-prompt p { color: #d1fae5; margin-bottom: 12px; font-size: 0.95rem; }

        .swap-box {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .swap-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        select {
            flex: 1;
            background: rgba(11, 15, 25, 0.8);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 12px;
            border-radius: 10px;
            min-width: 120px;
            outline: none;
        }

        /* حاوية السجل المخفية بشكل افتراضي مع سهم إظهار */
        .report-box {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            margin-top: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .report-content-wrapper {
            display: none; /* مخفي تماماً بشكل افتراضي */
            margin-top: 12px;
        }
        .report-item {
            font-size: 0.85rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--glass-border);
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .empty-msg { color: var(--text-muted); font-size: 0.85rem; padding: 8px 0; text-align: center; }
        
        .toggle-arrow-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .toggle-arrow-btn:hover { background: rgba(255, 255, 255, 0.15); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <button class="admin-badge" id="adminBtn" onclick="toggleAdmin()">🔒 وضع الأدمن</button>
        <button class="notif-badge" id="notifBtn" onclick="requestNotificationPermission()">🔔 الإشعارات</button>
        <h2>☕ استراحة الموظفين المشتركة</h2>
        <span class="status-tag"><span class="dot"></span> متصل لايف ومزامن للجميع</span>
    </header>

    <!-- صندوق تنبيه وتأكيد الدور الخاص بك -->
    <div id="myTurnPromptBox" class="my-turn-prompt">
        <h3 id="promptTitle">🎉 حان دورك بالبريك!</h3>
        <p id="promptDesc">الرجاء التأكيد والدخول الآن.</p>
        <button type="button" class="btn" style="background: #ffffff; color: #065f46; font-size: 1.05rem; width: 100%; border-radius: 10px;" onclick="confirmMyTurn()">✅ تأكيد ودخول البريك الآن</button>
    </div>

    <!-- صندوق الإدخال الأساسي -->
    <div class="action-box">
        <input type="text" id="empName" placeholder="أدخل اسمك أولاً..." autocomplete="off" />
        <div class="action-buttons">
            <button type="button" class="btn btn-green" onclick="submitBreak('normal')">بريك عادي 🏃</button>
            <button type="button" class="btn btn-amber" onclick="submitBreak('quick')">⚡ بريك سريع (5 دقائق)</button>
        </div>
    </div>

    <!-- قسم في البريك الآن (داخل مستطيل مخصص ومميز بلون وتدرج أخضر) -->
    <div class="section-container-active">
        <div class="section-header-title" style="color: #34d399;">
            <span>🏃 في البريك الآن (عادي + سريع)</span>
        </div>
        <div id="activeBox"></div>
    </div>

    <!-- قسم قائمة الانتظار (داخل مستطيل مخصص ومميز بلون وتدرج برتقالي/ذهبي) -->
    <div class="section-container-waiting">
        <div class="section-header-title" style="color: #fbbf24;">
            <span>📋 قائمة الانتظار</span>
        </div>
        <div id="waitingBox"></div>
    </div>

    <!-- صندوق تبديل الأدوار -->
    <div class="swap-box" id="swapSection" style="display: none;">
        <div style="font-weight: bold; color: var(--accent-amber);" id="swapSectionTitle">🔄 تبديل دورك في الانتظار:</div>
        <div class="swap-controls" id="swapControlsContainer"></div>
    </div>

    <!-- قسم السجل والتقارير (مخفي تماماً بشكل افتراضي مع سهم للإظهار) -->
    <div class="report-box">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="font-size: 0.95rem; font-weight: bold; color: var(--text-main); display: flex; align-items: center; gap: 6px;">
                <span>📊 سجل آخر 24 ساعة</span>
            </div>
            <div style="display: flex; gap: 6px; align-items: center;">
                <button type="button" class="btn btn-excel" id="excelBtn" onclick="exportToExcel()">📥 Excel</button>
                <button type="button" class="btn btn-gray" id="clearBtn" style="display: none;" onclick="clearReports()">مسح</button>
                <button type="button" class="toggle-arrow-btn" id="toggleReportsBtn" onclick="toggleReportsExpand()" title="إظهار/إخفاء السجل">▼</button>
            </div>
        </div>
        <div id="reportsContainerWrapper" class="report-content-wrapper">
            <div id="reportsBox"></div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://break-system-4a453-default-rtdb.firebaseio.com/"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database().ref('shared_company_breaks_v18');

    let state = { active: [], waiting: [], reports: [], swapLogs: [] };
    let isAdmin = localStorage.getItem('is_admin_mode') === 'true';
    let myName = localStorage.getItem('my_employee_name') || '';
    let isReportsExpanded = false;

    document.addEventListener('DOMContentLoaded', () => {
        updateNotificationButtonUI();
        if(myName) document.getElementById('empName').value = myName;
    });

    function toggleReportsExpand() {
        isReportsExpanded = !isReportsExpanded;
        const wrapper = document.getElementById('reportsContainerWrapper');
        const btn = document.getElementById('toggleReportsBtn');
        if (isReportsExpanded) {
            wrapper.style.display = 'block';
            btn.innerText = '▲';
            btn.title = 'إخفاء السجل';
        } else {
            wrapper.style.display = 'none';
            btn.innerText = '▼';
            btn.title = 'إظهار السجل';
        }
    }

    function updateNotificationButtonUI() {
        const btn = document.getElementById('notifBtn');
        if (!("Notification" in window)) {
            btn.style.display = 'none';
            return;
        }
        if (Notification.permission === "granted") {
            btn.innerText = '🔔 مفعلة';
        } else if (Notification.permission === "denied") {
            btn.innerText = '🔕 محظورة';
        } else {
            btn.innerText = '🔔 الإشعارات';
        }
    }

    function requestNotificationPermission() {
        if (!("Notification" in window)) return;
        Notification.requestPermission().then(() => {
            updateNotificationButtonUI();
        });
    }

    function playBeep() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } catch(e) {}
    }

    function sendDesktopNotification(title, bodyText) {
        playBeep();
        if ("Notification" in window && Notification.permission === "granted") {
            try {
                new Notification(title, { body: bodyText });
            } catch(e) {}
        }
    }

    let lastNotifiedTurnState = "";

    db.on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
            const twentyFourHoursAgo = Date.now() - (24 * 60 * 60 * 1000);
            let filteredReports = (val.reports || []).filter(rep => rep.endTimestamp > twentyFourHoursAgo);
            let filteredSwaps = (val.swapLogs || []).filter(sw => sw.timestamp > twentyFourHoursAgo);

            state = {
                active: val.active || [],
                waiting: val.waiting || [],
                reports: filteredReports,
                swapLogs: filteredSwaps
            };
        } else {
            state = { active: [], waiting: [], reports: [], swapLogs: [] };
        }

        checkMyTurnAndNotify();
        renderUI();
    });

    function checkMyTurnAndNotify() {
        if (!myName) return;
        const myUserLower = myName.trim().toLowerCase();
        const newActive = state.active || [];
        const newWaiting = state.waiting || [];

        const firstNormal = newWaiting.find(w => w.type === 'normal');
        const firstQuick = newWaiting.find(w => w.type === 'quick');
        const hasNormalSlot = !newActive.some(a => a.type === 'normal');
        const hasQuickSlot = !newActive.some(a => a.type === 'quick');

        const isMyTurn = (firstNormal && firstNormal.name.trim().toLowerCase() === myUserLower && hasNormalSlot) ||
                         (firstQuick && firstQuick.name.trim().toLowerCase() === myUserLower && hasQuickSlot);

        const myIndex = newWaiting.findIndex(w => w.name.trim().toLowerCase() === myUserLower);
        const isAlmostMyTurn = (myIndex === 0 && !isMyTurn);

        if (isMyTurn) {
            if (lastNotifiedTurnState !== "my_turn") {
                lastNotifiedTurnState = "my_turn";
                sendDesktopNotification("🚨 حان دورك بالبريك", "حان دورك بالبريك الرجاء التأكيد والدخول الآن");
            }
        } else if (isAlmostMyTurn) {
            if (lastNotifiedTurnState !== "almost_turn") {
                lastNotifiedTurnState = "almost_turn";
                sendDesktopNotification("⏳ تنبيه قرب الدور", "هناك شخص واحد قبلك استعد");
            }
        } else {
            if (myIndex > 0 || myIndex === -1) {
                lastNotifiedTurnState = "";
            }
        }

        if (newWaiting.length > 0) {
            let targetToShift = null;
            if (firstNormal && hasNormalSlot) targetToShift = firstNormal;
            else if (firstQuick && hasQuickSlot) targetToShift = firstQuick;

            if (targetToShift) {
                const now = Date.now();
                if (!targetToShift.turnStartTime) {
                    targetToShift.turnStartTime = now;
                    db.set(state);
                } else {
                    if (now - targetToShift.turnStartTime > 300000) {
                        const idx = newWaiting.findIndex(w => w.id === targetToShift.id);
                        if (idx > -1) {
                            const shiftedItem = newWaiting.splice(idx, 1)[0];
                            delete shiftedItem.turnStartTime;
                            newWaiting.push(shiftedItem);
                            db.set(state);
                        }
                    }
                }
            }
        }
    }

    function toggleAdmin() {
        if (!isAdmin) {
            const pass = prompt('الرجاء إدخال كلمة مرور الأدمن:');
            if (pass === '1234') { 
                isAdmin = true;
                localStorage.setItem('is_admin_mode', 'true');
                renderUI();
            } else if (pass !== null) {
                alert('كلمة المرور غير صحيحة!');
            }
        } else {
            isAdmin = false;
            localStorage.setItem('is_admin_mode', 'false');
            renderUI();
        }
    }

    function submitBreak(type) {
        const input = document.getElementById('empName');
        const name = input.value.trim();
        if (!name) {
            alert('يرجى إدخال اسمك أولاً!');
            return;
        }

        const nameLower = name.toLowerCase();
        const isInActive = state.active.some(item => item.name.trim().toLowerCase() === nameLower);
        const isInWaiting = state.waiting.some(item => item.name.trim().toLowerCase() === nameLower);

        if (isInActive || isInWaiting) {
            alert('عذراً، هذا الاسم موجود بالفعل (إما في البريك أو في الانتظار)!');
            return;
        }

        myName = name;
        localStorage.setItem('my_employee_name', myName);
        lastNotifiedTurnState = "";

        const now = Date.now();
        const newItem = {
            id: String(now),
            name: name,
            type: type,
            timestamp: now,
            timeStr: new Date().toLocaleTimeString('ar-KW', { hour: '2-digit', minute: '2-digit' })
        };

        if (state.waiting.length > 0) {
            state.waiting.push(newItem);
        } else {
            const hasNormal = state.active.some(item => item.type === 'normal');
            const hasQuick = state.active.some(item => item.type === 'quick');

            let canEnter = false;
            if (type === 'normal' && !hasNormal) canEnter = true;
            else if (type === 'quick' && !hasQuick) canEnter = true;

            if (canEnter) state.active.push(newItem);
            else state.waiting.push(newItem);
        }

        db.set(state);
    }

    function confirmMyTurn() {
        if (!myName) return;
        const myUserLower = myName.trim().toLowerCase();
        
        const index = state.waiting.findIndex(item => item.name.trim().toLowerCase() === myUserLower);
        if (index === -1) {
            alert('أنت لست في قائمة الانتظار حالياً!');
            return;
        }

        const userItem = state.waiting[index];
        const firstOfThisType = state.waiting.find(w => w.type === userItem.type);
        if (!firstOfThisType || firstOfThisType.id !== userItem.id) {
            alert('عذراً، يوجد شخص قبلك في طابور الانتظار يجب أن يأخذ دوره أولاً!');
            return;
        }

        const hasSameTypeActive = state.active.some(item => item.type === userItem.type);
        if (hasSameTypeActive) {
            alert(`مكان بريك (${userItem.type === 'normal' ? 'العادي' : 'السريع'}) ما زال ممتلئاً.`);
            return;
        }

        state.waiting.splice(index, 1);
        userItem.timestamp = Date.now();
        userItem.timeStr = new Date().toLocaleTimeString('ar-KW', { hour: '2-digit', minute: '2-digit' });
        delete userItem.turnStartTime;
        state.active.push(userItem);

        db.set(state);
    }

    function endBreak(index) {
        const finishedItem = state.active.splice(index, 1)[0];
        
        if (finishedItem) {
            const endTime = Date.now();
            const durationMs = endTime - finishedItem.timestamp;
            const durationMins = Math.floor(durationMs / 60000);
            const durationText = durationMins === 0 ? 'أقل من دقيقة' : `${durationMins} دقيقة`;
            const endTimeStr = new Date().toLocaleTimeString('ar-KW', { hour: '2-digit', minute: '2-digit' });
            const typeText = finishedItem.type === 'quick' ? 'بريك سريع (5 دقائق)' : 'بريك عادي';

            state.reports.unshift({
                name: finishedItem.name,
                type: typeText,
                startTime: finishedItem.timeStr,
                endTime: endTimeStr,
                duration: durationText,
                endTimestamp: endTime
            });
        }

        db.set(state);
    }

    function cancelWaiting(index) {
        const item = state.waiting[index];
        const isOwner = myName && item.name.trim().toLowerCase() === myName.trim().toLowerCase();

        if (!isOwner && !isAdmin) {
            alert('يمكنك إلغاء دورك الخاص فقط!');
            return;
        }

        if (confirm(`هل أنت متأكد من إلغاء دور (${item.name})؟`)) {
            state.waiting.splice(index, 1);
            db.set(state);
        }
    }

    function executeSwap() {
        let id1, id2;

        if (isAdmin) {
            id1 = document.getElementById('swap1').value;
            id2 = document.getElementById('swap2').value;
        } else {
            if (!myName) {
                alert('الرجاء إدخال اسمك أولاً!');
                return;
            }
            const myUserLower = myName.trim().toLowerCase();
            const myItem = state.waiting.find(w => w.name.trim().toLowerCase() === myUserLower);
            if (!myItem) {
                alert('أنت لست موجوداً في قائمة الانتظار للتبديل!');
                return;
            }
            id1 = myItem.id;
            id2 = document.getElementById('swapTarget').value;
        }

        if (!id1 || !id2 || id1 === id2) {
            alert('يرجى اختيار شخص للتبديل معه!');
            return;
        }

        const idx1 = state.waiting.findIndex(x => x.id === id1);
        const idx2 = state.waiting.findIndex(x => x.id === id2);

        if (idx1 > -1 && idx2 > -1) {
            if (!isAdmin) {
                if (Math.abs(idx1 - idx2) !== 1) {
                    alert('عذراً، يُسمح بالتبديل فقط مع الشخص الذي فوقك مباشرة أو تحتك مباشرة!');
                    return;
                }
            }

            const name1 = state.waiting[idx1].name;
            const name2 = state.waiting[idx2].name;
            const oldPos1 = idx1 + 1;
            const oldPos2 = idx2 + 1;

            const temp = state.waiting[idx1];
            state.waiting[idx1] = state.waiting[idx2];
            state.waiting[idx2] = temp;

            const newPos1 = idx1 + 1;
            const newPos2 = idx2 + 1;

            if (!state.swapLogs) state.swapLogs = [];

            state.swapLogs.unshift({
                id: String(Date.now() + 1),
                receiverName: name1,
                initiatorName: isAdmin ? 'الأدمن' : name2,
                oldPos: oldPos1,
                newPos: newPos1,
                timestamp: Date.now(),
                timeStr: new Date().toLocaleTimeString('ar-KW', { hour: '2-digit', minute: '2-digit' })
            });

            state.swapLogs.unshift({
                id: String(Date.now() + 2),
                receiverName: name2,
                initiatorName: isAdmin ? 'الأدمن' : name1,
                oldPos: oldPos2,
                newPos: newPos2,
                timestamp: Date.now(),
                timeStr: new Date().toLocaleTimeString('ar-KW', { hour: '2-digit', minute: '2-digit' })
            });

            db.set(state);
            alert('تم التبديل بنجاح!');
        }
    }

    function clearReports() {
        if (!isAdmin) return;
        if (confirm('هل أنت متأكد من مسح السجل والتقارير؟')) {
            state.reports = [];
            state.swapLogs = [];
            db.set(state);
        }
    }

    function exportToExcel() {
        if (!isAdmin) return;
        let csvContent = "\uFEFF--- سجل البريكات ---\nاسم الموظف,نوع البريك,وقت الخروج,وقت العودة,مدة البريك\n";
        (state.reports || []).forEach(rep => {
            csvContent += `"${rep.name}","${rep.type}","${rep.startTime}","${rep.endTime}","${rep.duration}"\n`;
        });

        csvContent += "\n\uFEFF--- سجل تبديل الأدوار ---\nالمستقبل للإشعار,المبدل,الرقم القديم,الرقم الجديد,الوقت\n";
        (state.swapLogs || []).forEach(sw => {
            csvContent += `"${sw.receiverName}","${sw.initiatorName}","${sw.oldPos}","${sw.newPos}","${sw.timeStr}"\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `reports.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function renderUI() {
        const currentTime = Date.now();
        const adminBtn = document.getElementById('adminBtn');
        const clearBtn = document.getElementById('clearBtn');
        const excelBtn = document.getElementById('excelBtn');
        
        if (isAdmin) {
            adminBtn.style.background = 'rgba(16, 185, 129, 0.2)';
            adminBtn.style.color = 'var(--accent-green)';
            adminBtn.innerText = '🔓 أدمن';
            clearBtn.style.display = 'inline-block';
            excelBtn.style.display = 'inline-block';
        } else {
            adminBtn.style.background = 'rgba(99, 102, 241, 0.15)';
            adminBtn.style.color = '#818cf8';
            adminBtn.innerText = '🔒 وضع الأدمن';
            clearBtn.style.display = 'none';
            excelBtn.style.display = 'none';
        }

        const promptBox = document.getElementById('myTurnPromptBox');
        let showMyPrompt = false;

        if (myName && state.waiting.length > 0) {
            const myUserLower = myName.trim().toLowerCase();
            const firstNormal = state.waiting.find(w => w.type === 'normal');
            const firstQuick = state.waiting.find(w => w.type === 'quick');
            const hasNormalSlot = !state.active.some(a => a.type === 'normal');
            const hasQuickSlot = !state.active.some(a => a.type === 'quick');

            if (firstNormal && firstNormal.name.trim().toLowerCase() === myUserLower && hasNormalSlot) {
                showMyPrompt = true;
            } else if (firstQuick && firstQuick.name.trim().toLowerCase() === myUserLower && hasQuickSlot) {
                showMyPrompt = true;
            }
        }
        promptBox.style.display = showMyPrompt ? 'block' : 'none';

        const aBox = document.getElementById('activeBox');
        if (!state.active || state.active.length === 0) {
            aBox.innerHTML = '<div class="empty-msg">لا يوجد أحد بالبريك حالياً</div>';
        } else {
            aBox.innerHTML = state.active.map((item, i) => {
                const minsInBreak = Math.floor((currentTime - item.timestamp) / 60000);
                const activeDurationStr = minsInBreak === 0 ? 'منذ أقل من دقيقة' : `منذ ${minsInBreak} دقيقة`;
                const isOwner = myName && item.name.trim().toLowerCase() === myName.trim().toLowerCase();
                const showEndBtn = (isOwner || isAdmin);
                const isQuick = item.type === 'quick';
                const isOvertime = isQuick && minsInBreak > 5;

                return `
                    <div class="card-active ${isOvertime ? 'overtime' : ''}">
                        <div>
                            <strong>${item.name}</strong> 
                            <span style="margin-right: 8px; font-size: 0.9rem;">⏱️ ${activeDurationStr}</span>
                            ${isQuick ? '<span style="color:#38bdf8;">[سريع]</span>' : '<span style="color:var(--accent-amber);">[عادي]</span>'}
                            <br><small style="color:var(--text-muted)">وقت الخروج: ${item.timeStr}</small>
                            ${isOvertime ? '<br><span style="color: #f87171; font-weight: bold; font-size: 0.85rem;">⚠️ تجاوزت 5 دقائق!</span>' : ''}
                        </div>
                        ${showEndBtn ? `<button type="button" class="btn btn-red" onclick="endBreak(${i})">إنهاء</button>` : ``}
                    </div>
                `;
            }).join('');
        }

        const wBox = document.getElementById('waitingBox');
        if (!state.waiting || state.waiting.length === 0) {
            wBox.innerHTML = '<div class="empty-msg">قائمة الانتظار فارغة</div>';
        } else {
            wBox.innerHTML = state.waiting.map((item, i) => {
                const minsWaiting = Math.floor((currentTime - item.timestamp) / 60000);
                const isOwner = myName && item.name.trim().toLowerCase() === myName.trim().toLowerCase();
                const showCancelBtn = (isOwner || isAdmin);
                const isQuick = item.type === 'quick';

                let swapMessageHtml = '';
                if (state.swapLogs && state.swapLogs.length > 0) {
                    const itemNameLower = item.name.trim().toLowerCase();
                    const recentLog = state.swapLogs.find(log => log.receiverName.trim().toLowerCase() === itemNameLower && (currentTime - log.timestamp < 600000));
                    if (recentLog) {
                        swapMessageHtml = `<br><span style="color: #38bdf8; font-size: 0.8rem; font-weight: bold;">💬 تم تغيير دورك مع ${recentLog.initiatorName}، كان دورك رقم ${recentLog.oldPos} وأصبح ${recentLog.newPos}</span>`;
                    }
                }

                return `
                    <div class="card-waiting">
                        <div>
                            <span>#${i + 1} - <strong>${item.name}</strong></span>
                            <span style="margin-right: 8px; color:var(--text-muted); font-size: 0.85rem;">انتظار: ${minsWaiting}د</span>
                            ${isQuick ? '<span style="color:#38bdf8;">[سريع]</span>' : '<span style="color:var(--accent-amber);">[عادي]</span>'}
                            ${swapMessageHtml}
                        </div>
                        ${showCancelBtn ? `<button type="button" class="btn btn-red" onclick="cancelWaiting(${i})">إلغاء</button>` : ``}
                    </div>
                `;
            }).join('');
        }

        const swapSection = document.getElementById('swapSection');
        const swapTitle = document.getElementById('swapSectionTitle');
        const swapControls = document.getElementById('swapControlsContainer');

        if (state.waiting && state.waiting.length >= 2) {
            swapSection.style.display = 'block';
            if (isAdmin) {
                swapTitle.innerText = '🔄 تبديل الأدوار (صلاحية الأدمن):';
                swapControls.innerHTML = `
                    <select id="swap1"></select>
                    <span>مع</span>
                    <select id="swap2"></select>
                    <button type="button" class="btn btn-amber" onclick="executeSwap()">تبديل</button>
                `;
                const s1 = document.getElementById('swap1');
                const s2 = document.getElementById('swap2');
                state.waiting.forEach((item, i) => {
                    s1.add(new Option(`#${i + 1} - ${item.name}`, item.id));
                    s2.add(new Option(`#${i + 1} - ${item.name}`, item.id));
                });
                if (s2.options.length > 1) s2.selectedIndex = 1;
            } else {
                swapTitle.innerText = '🔄 تبديل دوري (مع الملاصق لك فقط):';
                swapControls.innerHTML = `
                    <select id="swapTarget"></select>
                    <button type="button" class="btn btn-amber" onclick="executeSwap()">تبديل دوري</button>
                `;
                const sTarget = document.getElementById('swapTarget');
                const myUserLower = myName ? myName.trim().toLowerCase() : '';
                const myIdx = state.waiting.findIndex(item => item.name.trim().toLowerCase() === myUserLower);

                if (myIdx > -1) {
                    if (myIdx > 0) {
                        const aboveItem = state.waiting[myIdx - 1];
                        sTarget.add(new Option(`#${myIdx} - ${aboveItem.name} [فوقك مباشرة]`, aboveItem.id));
                    }
                    if (myIdx < state.waiting.length - 1) {
                        const belowItem = state.waiting[myIdx + 1];
                        sTarget.add(new Option(`#${myIdx + 2} - ${belowItem.name} [تحتك مباشرة]`, belowItem.id));
                    }
                }
            }
        } else {
            swapSection.style.display = 'none';
        }

        const rBox = document.getElementById('reportsBox');
        if (!state.reports || state.reports.length === 0) {
            rBox.innerHTML = '<div class="empty-msg">لا توجد تقارير مسجلة في آخر 24 ساعة</div>';
        } else {
            rBox.innerHTML = state.reports.map(rep => `
                <div class="report-item">
                    <div><strong>${rep.name}</strong> <span style="color:var(--text-muted)">(${rep.type})</span></div>
                    <span style="color: var(--accent-green); font-weight: bold;">${rep.duration}</span>
                </div>
            `).join('');
        }
    }
</script>
</body>
</html>
