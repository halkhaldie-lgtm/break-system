<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سستم استراحة الموظفين المشترك مع التقارير والمدة</title>
    <!-- استدعاء قواعد بيانات Firebase السحابية الحية -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #151d2a;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #232d3f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 650px; }

        header {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        h2 { font-size: 1.5rem; margin-bottom: 8px; }

        .status-tag {
            font-size: 0.85rem;
            color: var(--accent-green);
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px; height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .action-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: #0b0f19;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus { border-color: var(--accent-blue); }

        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        .btn-green { background: var(--accent-green); }
        .btn-amber { background: var(--accent-amber); color: #0b0f19; }
        .btn-red { background: var(--accent-red); padding: 6px 12px; font-size: 0.85rem; }
        .btn-gray { background: #334155; font-size: 0.8rem; padding: 4px 10px; }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 15px 0 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-active {
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid var(--accent-green);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-waiting {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .report-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 15px;
            margin-top: 25px;
        }

        .report-item {
            font-size: 0.85rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            padding: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-time {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-amber);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .badge-duration {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .empty-msg { color: var(--text-muted); font-size: 0.9rem; padding: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>☕ سستم استراحة الموظفين المشترك</h2>
        <span class="status-tag"><span class="dot"></span> متصل لايف ومزامن للجميع</span>
    </header>

    <form class="action-box" id="breakForm">
        <input type="text" id="empName" placeholder="أدخل اسمك واضغط Enter أو الزر..." autocomplete="off" required />
        <button type="submit" class="btn btn-green">طلب بريك 🏃</button>
    </form>

    <div class="section-title" style="color: var(--accent-green);">
        <span>🏃 في البريك الآن (أقصى حد 2)</span>
    </div>
    <div id="activeBox"></div>

    <div class="section-title" style="color: var(--accent-amber);">
        <span>📋 قائمة الانتظار</span>
    </div>
    <div id="waitingBox"></div>

    <!-- قسم تقارير وسجل البريكات اليومية -->
    <div class="report-box">
        <div class="section-title" style="margin: 0 0 10px 0; color: var(--text-main);">
            <span>📊 تقارير البريكات المنتهية اليوم</span>
            <button type="button" class="btn btn-gray" onclick="clearReports()">مسح السجل</button>
        </div>
        <div id="reportsBox"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://break-system-4a453-default-rtdb.firebaseio.com/"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database().ref('shared_company_breaks_v2');

    let state = { active: [], waiting: [], reports: [] };

    db.on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
            state = {
                active: val.active || [],
                waiting: val.waiting || [],
                reports: val.reports || []
            };
        } else {
            state = { active: [], waiting: [], reports: [] };
        }
        renderUI();
    });

    document.getElementById('breakForm').addEventListener('submit', function(e) {
        e.preventDefault();
        submitBreak();
    });

    function submitBreak() {
        const input = document.getElementById('empName');
        const name = input.value.trim();
        if (!name) return;

        const now = Date.now();
        const newItem = {
            id: String(now),
            name: name,
            timestamp: now,
            timeStr: new Date().toLocaleTimeString('ar-KW', { hour: '2-digit', minute: '2-digit' })
        };

        if (state.active.length < 2) {
            state.active.push(newItem);
        } else {
            state.waiting.push(newItem);
        }

        input.value = '';
        db.set(state);
    }

    function endBreak(index) {
        const finishedItem = state.active.splice(index, 1)[0];
        
        if (finishedItem) {
            const endTime = Date.now();
            const durationMs = endTime - finishedItem.timestamp;
            const durationMins = Math.floor(durationMs / 60000);
            const durationText = durationMins === 0 ? 'أقل من دقيقة' : `${durationMins} دقيقة`;
            const endTimeStr = new Date().toLocaleTimeString('ar-KW', { hour: '2-digit', minute: '2-digit' });

            // إضافة السجل للتقارير
            state.reports.unshift({
                name: finishedItem.name,
                startTime: finishedItem.timeStr,
                endTime: endTimeStr,
                duration: durationText
            });

            // الحفاظ على اخر 25 تقرير فقط لكي لا يتضخم السرفر
            if (state.reports.length > 25) {
                state.reports.pop();
            }
        }

        if (state.waiting.length > 0) {
            const next = state.waiting.shift();
            next.timestamp = Date.now();
            next.timeStr = new Date().toLocaleTimeString('ar-KW', { hour: '2-digit', minute: '2-digit' });
            state.active.push(next);
        }

        db.set(state);
    }

    function clearReports() {
        if (confirm('هل أنت متأكد من مسح سجل التقارير؟')) {
            state.reports = [];
            db.set(state);
        }
    }

    function renderUI() {
        const currentTime = Date.now();

        // عرض النشطين
        const aBox = document.getElementById('activeBox');
        if (!state.active || state.active.length === 0) {
            aBox.innerHTML = '<div class="empty-msg">لا يوجد أحد بالبريك حالياً</div>';
        } else {
            aBox.innerHTML = state.active.map((item, i) => {
                const minsInBreak = Math.floor((currentTime - item.timestamp) / 60000);
                const activeDurationStr = minsInBreak === 0 ? 'منذ أقل من دقيقة' : `منذ ${minsInBreak} دقيقة`;
                return `
                    <div class="card-active">
                        <div>
                            <strong>${item.name}</strong> 
                            <span class="badge-duration" style="margin-right: 8px;">⏱️ ${activeDurationStr}</span>
                            <br><small style="color:var(--text-muted)">وقت الخروج: ${item.timeStr}</small>
                        </div>
                        <button type="button" class="btn btn-red" onclick="endBreak(${i})">إنهاء البريك</button>
                    </div>
                `;
            }).join('');
        }

        // عرض قائمة الانتظار
        const wBox = document.getElementById('waitingBox');
        if (!state.waiting || state.waiting.length === 0) {
            wBox.innerHTML = '<div class="empty-msg">قائمة الانتظار فارغة</div>';
        } else {
            wBox.innerHTML = state.waiting.map((item, i) => {
                const minsWaiting = Math.floor((currentTime - item.timestamp) / 60000);
                const waitingDurationStr = minsWaiting === 0 ? 'منذ أقل من دقيقة' : `انتظار: ${minsWaiting} دقيقة`;
                return `
                    <div class="card-waiting">
                        <div>
                            <span>#${i + 1} - <strong>${item.name}</strong></span>
                        </div>
                        <span class="badge-time">${waitingDurationStr}</span>
                    </div>
                `;
            }).join('');
        }

        // عرض تقارير البريكات المنتهية
        const rBox = document.getElementById('reportsBox');
        if (!state.reports || state.reports.length === 0) {
            rBox.innerHTML = '<div class="empty-msg">لا توجد تقارير مسجلة حتى الآن اليوم</div>';
        } else {
            rBox.innerHTML = state.reports.map(rep => `
                <div class="report-item">
                    <div>
                        <strong>${rep.name}</strong> 
                        <span style="color:var(--text-muted); margin-right:6px;">(من ${rep.startTime} إلى ${rep.endTime})</span>
                    </div>
                    <span style="color: var(--accent-green); font-weight: bold;">المدة: ${rep.duration}</span>
                </div>
            `).join('');
        }
    }

    // تحديث الواجهة تلقائياً كل 30 ثانية لتحديث العدادات (الدقائق) بدون الحاجة لتحديث الصفحة
    setInterval(() => {
        if (state.active.length > 0 || state.waiting.length > 0) {
            renderUI();
        }
    }, 30000);
</script>
</body>
</html>
