<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام العد التنازلي لقائمة الانتظار</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            display: inline-block;
        }
        .timer {
            font-size: 48px;
            color: #d9534f;
            font-weight: bold;
            margin: 20px 0;
        }
        .status {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #4cae4c;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>إدارة الدور وقائمة الانتظار</h2>
    <div class="status" id="current-employee">الموظف الحالي: <span id="employee-name">أحمد</span></div>
    <div class="status" id="phase-status">الحالة: الوقت الاصلي</div>
    <div class="timer" id="countdown">05:00</div>
    <button onclick="confirmEmployee()">تأكيد الحضور</button>
</div>

<script>
    // قائمة الانتظار للموظفين
    let queue = ["أحمد", "محمد", "علي", "خالد"];
    
    // الأوقات بالثواني (5 دقائق أساسية، ودقيقتان مهلة)
    let timeLeft = 5 * 60; 
    let isGracePeriod = false; // هل نحن في فترة المهلة (الدقيقتين)؟
    let timerInterval;

    const countdownDisplay = document.getElementById("countdown");
    const employeeNameDisplay = document.getElementById("employee-name");
    const phaseStatusDisplay = document.getElementById("phase-status");

    function updateTimerDisplay() {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        
        // تنسيق الأرقام لتظهر دائماً بصيغة 00:00
        countdownDisplay.textContent = 
            (minutes < 10 ? "0" : "") + minutes + ":" + 
            (seconds < 10 ? "0" : "") + seconds;
    }

    function startCountdown() {
        updateTimerDisplay();
        
        timerInterval = setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                updateTimerDisplay();
            } else {
                // انتهى الوقت
                if (!isGracePeriod) {
                    // الانتقال إلى فترة المهلة (دقيقتين)
                    isGracePeriod = true;
                    timeLeft = 2 * 60; // دقيقتان
                    phaseStatusDisplay.textContent = "الحالة: مهلة إضافية (لم يتم التأكيد)";
                    phaseStatusDisplay.style.color = "#f0ad4e";
                } else {
                    // انتهت المهلة ولم يتم التأكيد -> نقل الموظف وتحديث الدور
                    moveToNextEmployee(true);
                }
            }
        }, 1000);
    }

    // دالة يتم استدعاؤها عند الضغط على زر "تأكيد الحضور"
    function confirmEmployee() {
        alert("تم تأكيد حضور الموظف: " + queue[0]);
        moveToNextEmployee(false);
    }

    // نقل الدور للشخص التالي
    function moveToNextEmployee(isTimeout) {
        clearInterval(timerInterval);

        let delayedEmployee = queue.shift(); // إزالة الموظف الحالي من البداية

        if (isTimeout) {
            // إذا انتهى الوقت ولم يؤكد، يتم نقله لنهاية القائمة (أو يمكن تعديلها ليصبح الأول حسب رغبتك الدقيقة)
            queue.push(delayedEmployee);
            console.log("تم نقل المتأخر " + delayedEmployee + " إلى نهاية القائمة.");
        } else {
            // إذا أكد، يتم إبعاده طبيعياً لنهاية الدور أيضاً أو حسب نظام المنظومة لديك
            queue.push(delayedEmployee);
        }

        // تحديث واجهة المستخدم للموظف الجديد
        employeeNameDisplay.textContent = queue[0];
        
        // إعادة ضبط المؤقت إلى 5 دقائق من جديد
        timeLeft = 5 * 60;
        isGracePeriod = false;
        phaseStatusDisplay.textContent = "الحالة: الوقت الاصلي";
        phaseStatusDisplay.style.color = "#333";

        // إعاد تشغيل العد التنازلي
        startCountdown();
    }

    // بدء المؤقت عند تحميل الصفحة
    window.onload = function() {
        employeeNameDisplay.textContent = queue[0];
        startCountdown();
    };
</script>

</body>
</html>
