<script>
function showCustomAlert(message) {
    var existingAlert = document.getElementById('custom-alert-box');
    if (existingAlert) {
        existingAlert.remove();
    }
    var alertBox = document.createElement('div');
    alertBox.id = 'custom-alert-box';
    alertBox.style.position = 'fixed';
    alertBox.style.top = '20px';
    alertBox.style.left = '50%';
    alertBox.style.transform = 'translateX(-50%)';
    alertBox.style.backgroundColor = '#fff';
    alertBox.style.border = '2px solid #ff4d4d';
    alertBox.style.boxShadow = '0 4px 15px rgba(0, 0, 0, 0.2)';
    alertBox.style.padding = '20px 25px';
    alertBox.style.zIndex = '10000';
    alertBox.style.borderRadius = '8px';
    alertBox.style.textAlign = 'center';
    alertBox.style.maxWidth = '400px';
    alertBox.style.width = '90%';
    alertBox.style.fontFamily = 'Arial, sans-serif';

    var titleDiv = document.createElement('div');
    titleDiv.style.color = '#ff4d4d';
    titleDiv.style.fontSize = '20px';
    titleDiv.style.fontWeight = 'bold';
    titleDiv.style.marginBottom = '10px';
    titleDiv.innerHTML = '⚠️ تنبيه';

    var msgDiv = document.createElement('div');
    msgDiv.style.color = '#333';
    msgDiv.style.fontSize = '15px';
    msgDiv.style.lineHeight = '1.5';
    msgDiv.style.marginBottom = '15px';
    msgDiv.textContent = message;

    var btn = document.createElement('button');
    btn.id = 'custom-alert-btn';
    btn.style.backgroundColor = '#ff4d4d';
    btn.style.color = 'white';
    btn.style.border = 'none';
    btn.style.padding = '8px 20px';
    btn.style.fontSize = '14px';
    btn.style.fontWeight = 'bold';
    btn.style.borderRadius = '4px';
    btn.style.cursor = 'pointer';
    btn.textContent = 'حسناً';

    alertBox.appendChild(titleDiv);
    alertBox.appendChild(msgDiv);
    alertBox.appendChild(btn);

    document.body.appendChild(alertBox);

    btn.onclick = function() {
        alertBox.remove();
    };
}
</script>
